<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛預算小管家 (雲端版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FFF0F5; }
        .selection-pink::selection { background-color: #FBCFE8; }
        
        /* 動畫 */
        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pop-in {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        .animate-pop-in { animation: pop-in 0.2s ease-out; }
        
        /* 隱藏數字輸入框的箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* 滾動條美化 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-700 selection-pink pb-24">

    <!-- 頂部導航 -->
    <div class="sticky top-0 z-30 bg-white/80 backdrop-blur-md shadow-sm px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2 flex-1 group cursor-pointer" id="title-container">
            <h1 id="app-title-display" class="text-xl font-bold text-pink-800 truncate">載入中...</h1>
            <i data-lucide="edit-2" class="w-3.5 h-3.5 text-pink-300 opacity-0 group-hover:opacity-100 transition-opacity"></i>
            <input id="app-title-input" class="hidden flex-1 bg-pink-50 border border-pink-200 rounded px-2 py-1 text-lg font-bold text-pink-800 outline-none focus:ring-2 focus:ring-pink-300" />
            <button id="save-title-btn" class="hidden p-1 bg-green-100 text-green-600 rounded-full"><i data-lucide="save" class="w-4 h-4"></i></button>
        </div>

        <div class="flex items-center space-x-2 ml-2">
            <!-- 雲端狀態 -->
            <div id="cloud-status" class="flex items-center space-x-1 px-2 py-1 bg-slate-50 rounded-full text-xs transition-colors cursor-pointer border border-transparent" title="點擊查看狀態">
                <i data-lucide="cloud" class="w-3.5 h-3.5 text-slate-400"></i>
                <span class="text-slate-400">連線中</span>
            </div>
            <!-- 隱私模式 -->
            <button id="privacy-btn" class="p-2 bg-pink-100 hover:bg-pink-200 rounded-full text-pink-600 transition-colors">
                <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- 總收入與總剩餘卡片 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-pink-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                <i data-lucide="dollar-sign" class="w-24 h-24 text-pink-400 rotate-12"></i>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 mb-1 block uppercase tracking-wider">本月收入</label>
                    <div class="flex items-center">
                        <span class="text-lg font-bold text-slate-400 mr-1">$</span>
                        <input type="number" id="income-input" class="w-full text-2xl font-extrabold text-slate-700 bg-transparent outline-none placeholder-slate-200 z-10" value="30000">
                    </div>
                </div>
                <div class="border-l border-slate-100 pl-4">
                    <label class="text-xs font-bold text-slate-400 mb-1 block uppercase tracking-wider">剩餘可花</label>
                    <div class="flex items-center text-green-500">
                        <span class="text-lg font-bold mr-1">$</span>
                        <span id="total-remaining-display" class="text-2xl font-extrabold">0</span>
                    </div>
                </div>
            </div>

            <!-- 狀態提示條 -->
            <div id="status-bar" class="mt-4 p-3 rounded-xl flex items-center text-sm font-bold transition-colors bg-blue-50 text-blue-600">
                <div id="status-icon" class="mr-2 text-lg">✏️</div>
                <div id="status-text" class="flex-1">計算中...</div>
            </div>
        </div>

        <!-- 圖表區 -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pink-100 flex flex-col items-center justify-center relative">
            <div class="w-48 h-48 relative">
                <canvas id="budgetChart"></canvas>
                <!-- 中間文字 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span class="text-xs text-slate-400">總花費</span>
                    <span id="total-spent-percent" class="text-xl font-bold text-slate-700">0%</span>
                </div>
            </div>
            <!-- 鼓勵小語 -->
            <div id="quote-text" class="mt-4 text-center text-slate-500 text-sm italic bg-slate-50 px-4 py-2 rounded-full">
                規劃好每一分錢，讓夢想更靠近！✨
            </div>
        </div>

        <!-- 預算列表標題 -->
        <div class="flex items-center justify-between px-2">
            <h2 class="text-lg font-bold text-slate-700 flex items-center">
                <i data-lucide="wallet" class="mr-2 text-pink-400 w-5 h-5"></i> 預算執行狀況
            </h2>
            <button id="manage-category-btn" class="flex items-center space-x-1 text-slate-400 hover:text-slate-600 transition-colors text-xs font-bold">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i> <span>管理類別</span>
            </button>
        </div>

        <!-- 預算列表 -->
        <div id="category-list" class="space-y-3 pb-20">
            <!-- JS 動態生成 -->
        </div>

    </div>

    <!-- 懸浮記帳按鈕 FAB -->
    <button id="fab-add-expense" class="fixed bottom-6 right-6 w-14 h-14 bg-pink-500 hover:bg-pink-600 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-110 active:scale-95 z-40">
        <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <!-- 記帳 Modal -->
    <div id="expense-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/20 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                <span class="bg-pink-100 p-2 rounded-full mr-2">💸</span> 記一筆
            </h2>

            <div class="space-y-4">
                <!-- 金額 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">花費金額</label>
                    <div class="relative mt-1">
                        <span class="absolute left-3 top-3 text-slate-400 font-bold">$</span>
                        <input type="number" id="expense-amount" placeholder="0" class="w-full p-3 pl-7 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-pink-200 font-bold text-slate-700 text-2xl" autoFocus>
                    </div>
                </div>
                
                <!-- 類別選擇 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">消費類別</label>
                    <div id="expense-category-picker" class="grid grid-cols-4 gap-2 mt-2">
                        <!-- JS 生成 -->
                    </div>
                </div>

                <!-- 備註 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">備註 (選填)</label>
                    <input type="text" id="expense-note" placeholder="例如: 午餐、買飲料" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-pink-200 font-bold text-slate-700">
                </div>
            </div>

            <!-- 按鈕區 -->
            <div class="flex gap-3 mt-8">
                <button id="expense-cancel-btn" class="flex-1 py-3 text-slate-500 font-bold bg-slate-100 rounded-xl hover:bg-slate-200">取消</button>
                <button id="expense-save-btn" class="flex-[2] py-3 text-white font-bold bg-slate-800 hover:bg-slate-900 rounded-xl shadow-lg active:scale-95 transition-all">儲存</button>
            </div>
        </div>
    </div>

    <!-- 類別管理/詳情 Modal -->
    <div id="category-detail-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/20 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up h-[85vh] sm:h-auto flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="detail-title" class="text-xl font-bold text-slate-800">類別詳情</h2>
                    <p id="detail-subtitle" class="text-xs text-slate-400 mt-1">支出紀錄</p>
                </div>
                <button id="detail-edit-btn" class="text-xs bg-slate-100 px-3 py-1.5 rounded-full font-bold text-slate-600 hover:bg-slate-200">
                    修改預算
                </button>
            </div>

            <!-- 支出列表 -->
            <div id="detail-list" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-1 hide-scrollbar">
                <!-- JS 生成 -->
            </div>

            <!-- 按鈕區 -->
            <div class="mt-auto">
                <button id="detail-close-btn" class="w-full py-3 text-slate-500 font-bold bg-slate-100 rounded-xl hover:bg-slate-200">關閉</button>
            </div>
        </div>
    </div>

    <!-- 編輯預算 Modal (原本的 Modal) -->
    <div id="modal" class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-pop-in" onclick="event.stopPropagation()">
            <h2 id="modal-title" class="text-xl font-bold text-slate-800 mb-6">設定類別預算</h2>

            <div class="space-y-4">
                <!-- 名稱 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">項目名稱</label>
                    <input type="text" id="modal-name" placeholder="例如: 買switch基金" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-pink-200 font-bold text-slate-700">
                </div>
                <!-- 金額 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">預算金額</label>
                    <div class="relative mt-1">
                        <span class="absolute left-3 top-3 text-slate-400 font-bold">$</span>
                        <input type="number" id="modal-amount" placeholder="0" class="w-full p-3 pl-7 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-pink-200 font-bold text-slate-700">
                    </div>
                </div>
                <!-- 顏色 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">標籤顏色</label>
                    <div id="color-picker" class="flex gap-2 mt-2 overflow-x-auto pb-2 hide-scrollbar">
                        <!-- JS 生成 -->
                    </div>
                </div>
                <!-- 圖示 -->
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">圖示</label>
                    <div id="icon-picker" class="flex gap-3 mt-2 overflow-x-auto pb-2 hide-scrollbar">
                        <!-- JS 生成 -->
                    </div>
                </div>
            </div>

            <!-- 按鈕區 -->
            <div class="flex gap-3 mt-8">
                <button id="modal-delete-btn" class="hidden p-4 bg-red-50 text-red-400 rounded-xl hover:bg-red-100 transition-colors">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
                <button id="modal-cancel-btn" class="flex-1 py-3 text-slate-500 font-bold bg-slate-100 rounded-xl hover:bg-slate-200">取消</button>
                <button id="modal-save-btn" class="flex-[2] py-3 text-white font-bold bg-slate-800 hover:bg-slate-900 rounded-xl shadow-lg active:scale-95 transition-all">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 底部裝飾線 -->
    <div class="fixed bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-pink-300 via-purple-300 to-blue-300"></div>

    <!-- 邏輯腳本 (Module 模式以支援 import) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 設定與常數 ---
        const firebaseConfig = {
            apiKey: "AIzaSyD6HngA3NX5sMW6jSvDE0b90ozr_cw0yCk",
            authDomain: "budget-70835.firebaseapp.com",
            projectId: "budget-70835",
            storageBucket: "budget-70835.firebasestorage.app",
            messagingSenderId: "780821810140",
            appId: "1:780821810140:web:e8cc10ae8bb8bd7b10dd19",
            measurementId: "G-PVVY6Z5JV4"
        };

        const APP_ID = 'budget-app-deploy'; 
        const COLORS = ['#FCA5A5', '#FDBA74', '#FDE047', '#86EFAC', '#93C5FD', '#C4B5FD', '#F9A8D4', '#CBD5E1'];
        const ICONS = ['wallet', 'home', 'coffee', 'smartphone', 'shopping-bag', 'heart', 'plane', 'gift', 'music', 'sparkles'];
        const QUOTES = {
            normal: "記帳是理財的第一步！加油！✨",
            perfect: "太棒了！預算控制得剛剛好！🐰",
            surplus: "哇！省下的錢可以存起來買喜歡的東西！💰",
            deficit: "歐歐... 超出預算了，要稍微節制一下囉 🦛💦"
        };

        // --- 初始化 Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 全域狀態 ---
        let state = {
            user: null,
            isOffline: false,
            income: 30000,
            categories: [
                { id: '1', name: '房租水電', amount: 8000, color: '#FCA5A5', icon: 'home' },
                { id: '2', name: '伙食費', amount: 6000, color: '#FDBA74', icon: 'coffee' },
                { id: '3', name: '夢想基金', amount: 5000, color: '#C4B5FD', icon: 'heart' }
            ],
            expenses: [], // 新增: 支出紀錄 {id, catId, amount, note, date}
            appTitle: "2026 小富婆計畫",
            isPrivacyMode: false,
            editingId: null,
            saveStatus: 'saved'
        };

        let budgetChart = null;

        // --- 核心邏輯 ---

        async function init() {
            loadFromLocal();
            renderAll();

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    state.isOffline = false;
                    setupDataListener(user.uid);
                } else {
                    signInAnonymously(auth).catch((error) => {
                        console.warn("切換至離線模式", error);
                        state.isOffline = true;
                        updateSaveStatus('offline-mode');
                    });
                }
            });
            
            initChart();
        }

        function setupDataListener(uid) {
            const docRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'data', 'budget');
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let needsRender = false;
                    
                    if (data.income !== undefined) { state.income = data.income; needsRender = true; }
                    if (data.categories) { state.categories = data.categories; needsRender = true; }
                    if (data.expenses) { state.expenses = data.expenses; needsRender = true; } // 載入支出
                    if (data.appTitle) { state.appTitle = data.appTitle; needsRender = true; }
                    
                    if (needsRender) renderAll();
                }
            }, (error) => {
                state.isOffline = true;
                updateSaveStatus('offline-mode');
            });
        }
        
        function loadFromLocal() {
            try {
                const localData = localStorage.getItem('budget_local_data');
                if (localData) {
                    const data = JSON.parse(localData);
                    state.income = data.income ?? 30000;
                    state.categories = data.categories ?? state.categories;
                    state.expenses = data.expenses ?? []; // 載入支出
                    state.appTitle = data.appTitle ?? state.appTitle;
                }
            } catch(e) { console.warn("Local data error", e); }
        }

        let saveTimeout;
        function scheduleSave() {
            updateSaveStatus('saving');
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                // Save Local
                try {
                    localStorage.setItem('budget_local_data', JSON.stringify({
                        income: Number(state.income),
                        categories: state.categories,
                        expenses: state.expenses,
                        appTitle: state.appTitle
                    }));
                } catch(e) {}

                if (state.isOffline) {
                    updateSaveStatus('saved-local');
                    return;
                }

                if (state.user) {
                    try {
                        const docRef = doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'data', 'budget');
                        await setDoc(docRef, {
                            income: Number(state.income),
                            categories: state.categories,
                            expenses: state.expenses, // 儲存支出
                            appTitle: state.appTitle
                        }, { merge: true });
                        updateSaveStatus('saved');
                    } catch (e) {
                        state.isOffline = true;
                        updateSaveStatus('saved-local');
                    }
                }
            }, 800);
        }

        // --- 計算邏輯 ---
        function getCategoryStats(catId) {
            const spent = state.expenses
                .filter(e => e.catId === catId)
                .reduce((sum, e) => sum + Number(e.amount), 0);
            
            const category = state.categories.find(c => c.id === catId);
            const budget = Number(category?.amount || 0);
            const remaining = budget - spent;
            const percentage = budget > 0 ? (spent / budget) * 100 : 0;
            
            return { spent, budget, remaining, percentage };
        }

        // --- UI 渲染 ---

        function renderAll() {
            renderHeader();
            renderStats();
            renderList();
            updateChart();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderHeader() {
            const displayEl = document.getElementById('app-title-display');
            const inputEl = document.getElementById('app-title-input');
            if(displayEl) displayEl.textContent = state.appTitle;
            if(inputEl) inputEl.value = state.appTitle;

            const incomeInput = document.getElementById('income-input');
            if (incomeInput) {
                if (state.isPrivacyMode) {
                    incomeInput.type = "password";
                } else {
                    incomeInput.type = "number";
                    incomeInput.value = state.income;
                }
            }
            
            const privacyBtn = document.getElementById('privacy-btn');
            if(privacyBtn) privacyBtn.innerHTML = `<i data-lucide="${state.isPrivacyMode ? 'eye-off' : 'eye'}" class="w-5 h-5"></i>`;
        }

        function updateSaveStatus(status) {
            state.saveStatus = status;
            const el = document.getElementById('cloud-status');
            if (!el) return;
            
            el.onclick = null;
            el.className = "flex items-center space-x-1 px-2 py-1 rounded-full text-xs transition-colors cursor-default border border-transparent";

            let iconName = '';
            let iconClass = '';
            let textContent = '';
            let textClass = '';

            if (status === 'saving') {
                el.classList.add('bg-blue-50');
                iconName = 'refresh-cw'; iconClass = 'text-blue-400 animate-spin w-3 h-3'; textContent = "儲存中"; textClass = "text-blue-400";
            } else if (status === 'saved') {
                el.classList.add('bg-green-50');
                iconName = 'cloud'; iconClass = 'text-green-500 w-3.5 h-3.5'; textContent = "已備份"; textClass = "text-green-500";
            } else if (status === 'saved-local' || status === 'offline-mode') {
                el.classList.add('bg-orange-50', 'border-orange-100');
                iconName = 'wifi-off'; iconClass = 'text-orange-500 w-3.5 h-3.5'; textContent = "本機模式"; textClass = "text-orange-500";
            } else {
                el.classList.add('bg-red-50');
                iconName = 'alert-circle'; iconClass = 'text-red-500 w-3.5 h-3.5'; textContent = "錯誤"; textClass = "text-red-500";
            }

            el.innerHTML = `<i data-lucide="${iconName}" class="${iconClass}"></i><span class="${textClass} ml-1">${textContent}</span>`;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderStats() {
            // 計算總花費
            const totalSpent = state.expenses.reduce((sum, e) => sum + Number(e.amount), 0);
            const totalBudget = state.categories.reduce((sum, c) => sum + Number(c.amount), 0);
            // 總剩餘 (收入 - 已花費) 或 (總預算 - 已花費) ? 
            // 這裡顯示 "收入 - 已花費" 代表現金流剩餘
            const totalRemaining = state.income - totalSpent; 
            
            const remainingEl = document.getElementById('total-remaining-display');
            if(remainingEl) {
                remainingEl.textContent = formatMoney(totalRemaining);
                remainingEl.className = totalRemaining >= 0 ? "text-2xl font-extrabold text-green-500" : "text-2xl font-extrabold text-red-500";
            }

            const percentSpent = state.income > 0 ? Math.round((totalSpent / state.income) * 100) : 0;
            const spentPercentEl = document.getElementById('total-spent-percent');
            if(spentPercentEl) spentPercentEl.textContent = `${percentSpent}%`;

            // 更新提示語
            const statusEl = document.getElementById('status-bar');
            const iconEl = document.getElementById('status-icon');
            const textEl = document.getElementById('status-text');
            const quoteEl = document.getElementById('quote-text');

            if (!statusEl) return;

            if (totalRemaining < 0) {
                statusEl.className = "mt-4 p-3 rounded-xl flex items-center text-sm font-bold transition-colors bg-red-50 text-red-500";
                iconEl.textContent = "🌧️"; textEl.textContent = `透支了 ${formatMoney(Math.abs(totalRemaining))}！`; quoteEl.textContent = QUOTES.deficit;
            } else if (totalRemaining > 0) {
                statusEl.className = "mt-4 p-3 rounded-xl flex items-center text-sm font-bold transition-colors bg-green-50 text-green-600";
                iconEl.textContent = "🌱"; textEl.textContent = `還剩 ${formatMoney(totalRemaining)} 可以運用`; quoteEl.textContent = QUOTES.surplus;
            } else {
                statusEl.className = "mt-4 p-3 rounded-xl flex items-center text-sm font-bold transition-colors bg-blue-50 text-blue-600";
                iconEl.textContent = "⭐"; textEl.textContent = "剛好花完！"; quoteEl.textContent = QUOTES.perfect;
            }
        }

        function renderList() {
            const container = document.getElementById('category-list');
            if (!container) return;
            container.innerHTML = '';

            if (state.categories.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl"><p>還沒有預算項目哦！</p><p class="text-xs mt-1">點擊右上角「管理類別」來新增</p></div>`;
                return;
            }

            state.categories.forEach(cat => {
                const { spent, budget, remaining, percentage } = getCategoryStats(cat.id);
                const isOver = remaining < 0;
                
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 active:scale-[0.99] transition-transform cursor-pointer group relative overflow-hidden";
                div.onclick = () => openCategoryDetail(cat);
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2 relative z-10">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm" style="background-color: ${cat.color}">
                                <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-700 leading-tight">${cat.name}</h3>
                                <div class="text-[10px] text-slate-400 mt-0.5">預算 ${formatMoney(budget)}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-lg ${isOver ? 'text-red-500' : 'text-slate-700'}">${formatMoney(remaining)}</div>
                            <div class="text-[10px] ${isOver ? 'text-red-400' : 'text-green-500'} font-medium">剩餘</div>
                        </div>
                    </div>
                    
                    <div class="relative z-10">
                        <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                            <span>已花 ${formatMoney(spent)}</span>
                            <span>${Math.min(100, Math.round(percentage))}%</span>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-500 ${isOver ? 'bg-red-400' : ''}" style="width: ${Math.min(100, percentage)}%; background-color: ${isOver ? '' : cat.color}"></div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- Chart.js ---
        function initChart() {
            const canvas = document.getElementById('budgetChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (budgetChart) budgetChart.destroy();

            budgetChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    cutout: '70%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChart() {
            if (!budgetChart) return;
            
            // 圖表顯示「花費分佈」
            // 收集每個類別的花費
            let data = [];
            let labels = [];
            let colors = [];
            
            state.categories.forEach(cat => {
                const { spent } = getCategoryStats(cat.id);
                if (spent > 0) {
                    labels.push(cat.name);
                    data.push(spent);
                    colors.push(cat.color);
                }
            });

            // 如果什麼都沒花，顯示一個空的灰圈
            if (data.length === 0) {
                data = [1];
                colors = ['#F1F5F9'];
                labels = ['尚未消費'];
            }

            budgetChart.data.labels = labels;
            budgetChart.data.datasets[0].data = data;
            budgetChart.data.datasets[0].backgroundColor = colors;
            budgetChart.update();
        }

        // --- Modals ---
        
        // 1. Expense Modal (記帳)
        let expenseForm = { amount: '', catId: '', note: '' };

        function openExpenseModal() {
            const modal = document.getElementById('expense-modal');
            modal.classList.remove('hidden');
            
            expenseForm = { amount: '', catId: state.categories[0]?.id || '', note: '' };
            renderExpenseForm();
            
            // Auto focus
            setTimeout(() => document.getElementById('expense-amount').focus(), 100);
        }

        function renderExpenseForm() {
            document.getElementById('expense-amount').value = expenseForm.amount;
            document.getElementById('expense-note').value = expenseForm.note;
            
            const picker = document.getElementById('expense-category-picker');
            picker.innerHTML = '';
            
            state.categories.forEach(cat => {
                const isSelected = expenseForm.catId === cat.id;
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center p-2 rounded-xl border transition-all ${isSelected ? 'bg-slate-800 text-white border-slate-800' : 'bg-white border-slate-100 text-slate-500'}`;
                btn.onclick = () => { expenseForm.catId = cat.id; renderExpenseForm(); };
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center mb-1" style="background-color: ${isSelected ? 'rgba(255,255,255,0.2)' : cat.color}">
                        <i data-lucide="${cat.icon}" class="w-4 h-4 ${isSelected ? 'text-white' : 'text-white'}"></i>
                    </div>
                    <span class="text-[10px] font-bold truncate w-full">${cat.name}</span>
                `;
                picker.appendChild(btn);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.getElementById('expense-save-btn').addEventListener('click', () => {
            if (!expenseForm.amount || !expenseForm.catId) return;
            
            state.expenses.push({
                id: Date.now().toString(),
                catId: expenseForm.catId,
                amount: Number(expenseForm.amount),
                note: expenseForm.note,
                date: new Date().toISOString()
            });
            
            document.getElementById('expense-modal').classList.add('hidden');
            renderAll();
            scheduleSave();
        });

        document.getElementById('fab-add-expense').addEventListener('click', openExpenseModal);
        document.getElementById('expense-cancel-btn').addEventListener('click', () => document.getElementById('expense-modal').classList.add('hidden'));

        // 2. Category Detail Modal (詳情)
        let currentDetailCat = null;

        function openCategoryDetail(cat) {
            currentDetailCat = cat;
            const modal = document.getElementById('category-detail-modal');
            modal.classList.remove('hidden');
            
            document.getElementById('detail-title').textContent = cat.name;
            const { spent, budget } = getCategoryStats(cat.id);
            document.getElementById('detail-subtitle').textContent = `預算 ${formatMoney(budget)} · 已花 ${formatMoney(spent)}`;
            
            const list = document.getElementById('detail-list');
            list.innerHTML = '';
            
            // 該類別的支出紀錄 (新到舊)
            const catExpenses = state.expenses
                .filter(e => e.catId === cat.id)
                .sort((a, b) => b.id - a.id); // 簡單用ID(時間戳)排序

            if (catExpenses.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">還沒有支出紀錄</div>`;
            } else {
                catExpenses.forEach(exp => {
                    const item = document.createElement('div');
                    item.className = "flex justify-between items-center p-3 bg-slate-50 rounded-xl";
                    
                    // 日期格式化
                    const date = new Date(Number(exp.id)); // 假設ID是timestamp
                    const dateStr = `${date.getMonth()+1}/${date.getDate()}`;
                    
                    item.innerHTML = `
                        <div>
                            <div class="font-bold text-slate-700">${exp.note || '未分類支出'}</div>
                            <div class="text-xs text-slate-400">${dateStr}</div>
                        </div>
                        <div class="flex items-center">
                            <span class="font-bold text-slate-700 mr-3">${formatMoney(exp.amount)}</span>
                            <button class="text-slate-300 hover:text-red-400 delete-exp-btn"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                    
                    // 刪除按鈕邏輯
                    item.querySelector('.delete-exp-btn').onclick = (e) => {
                        e.stopPropagation();
                        if(confirm('確定刪除這筆紀錄嗎？')) {
                            state.expenses = state.expenses.filter(x => x.id !== exp.id);
                            renderAll();
                            scheduleSave();
                            openCategoryDetail(currentDetailCat); // 重刷詳情
                        }
                    };
                    
                    list.appendChild(item);
                });
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.getElementById('detail-close-btn').addEventListener('click', () => document.getElementById('category-detail-modal').classList.add('hidden'));
        document.getElementById('detail-edit-btn').addEventListener('click', () => {
            document.getElementById('category-detail-modal').classList.add('hidden');
            openModal(currentDetailCat); // 開啟編輯預算 Modal
        });

        // 3. Edit Budget Modal (原本的類別管理)
        // 綁定「管理類別」按鈕到新增模式
        document.getElementById('manage-category-btn').addEventListener('click', () => openModal());

        let modalForm = { name: '', amount: '', color: COLORS[0], icon: 'wallet' };

        function openModal(category = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const deleteBtn = document.getElementById('modal-delete-btn');
            
            modal.classList.remove('hidden');
            
            if (category) {
                state.editingId = category.id;
                modalForm = { ...category };
                title.textContent = '修改類別預算';
                deleteBtn.classList.remove('hidden');
            } else {
                state.editingId = null;
                modalForm = { name: '', amount: '', color: COLORS[Math.floor(Math.random()*COLORS.length)], icon: 'wallet' };
                title.textContent = '新增預算類別';
                deleteBtn.classList.add('hidden');
            }
            renderModalForm();
        }

        function renderModalForm() {
            document.getElementById('modal-name').value = modalForm.name;
            document.getElementById('modal-amount').value = modalForm.amount;
            
            const colorContainer = document.getElementById('color-picker');
            colorContainer.innerHTML = '';
            COLORS.forEach(color => {
                const btn = document.createElement('button');
                btn.className = `w-8 h-8 rounded-full flex-shrink-0 transition-transform ${modalForm.color === color ? 'scale-110 ring-2 ring-offset-2 ring-slate-300' : ''}`;
                btn.style.backgroundColor = color;
                btn.onclick = () => { modalForm.color = color; renderModalForm(); };
                colorContainer.appendChild(btn);
            });

            const iconContainer = document.getElementById('icon-picker');
            iconContainer.innerHTML = '';
            ICONS.forEach(icon => {
                const isSelected = modalForm.icon === icon;
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-xl transition-all ${isSelected ? 'bg-pink-100 text-pink-500' : 'bg-slate-50 text-slate-400'}`;
                btn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
                btn.onclick = () => { modalForm.icon = icon; renderModalForm(); };
                iconContainer.appendChild(btn);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // --- Common Listeners ---
        document.getElementById('income-input').addEventListener('input', (e) => {
            state.income = Number(e.target.value);
            renderStats();
            updateChart();
            renderList(); 
            scheduleSave();
        });

        // Modal Controls
        document.getElementById('modal-cancel-btn').addEventListener('click', () => document.getElementById('modal').classList.add('hidden'));
        document.getElementById('modal-name').addEventListener('input', (e) => modalForm.name = e.target.value);
        document.getElementById('modal-amount').addEventListener('input', (e) => modalForm.amount = e.target.value);

        // Save Category
        document.getElementById('modal-save-btn').addEventListener('click', () => {
            if (!modalForm.name) return;
            const newAmount = Number(modalForm.amount) || 0;
            
            if (state.editingId) {
                state.categories = state.categories.map(c => 
                    c.id === state.editingId ? { ...modalForm, id: c.id, amount: newAmount } : c
                );
            } else {
                state.categories.push({ ...modalForm, id: Date.now().toString(), amount: newAmount });
            }
            
            document.getElementById('modal').classList.add('hidden');
            renderAll();
            scheduleSave();
        });

        // Delete Category
        document.getElementById('modal-delete-btn').addEventListener('click', () => {
            if (state.editingId) {
                if(confirm('刪除這個類別也會一併刪除相關的支出紀錄，確定嗎？')) {
                    state.categories = state.categories.filter(c => c.id !== state.editingId);
                    state.expenses = state.expenses.filter(e => e.catId !== state.editingId); // 刪除關聯支出
                    document.getElementById('modal').classList.add('hidden');
                    renderAll();
                    scheduleSave();
                }
            }
        });

        // Title & Privacy (Re-binding for safety)
        const privacyBtn = document.getElementById('privacy-btn');
        if (privacyBtn) privacyBtn.onclick = () => { state.isPrivacyMode = !state.isPrivacyMode; renderAll(); };

        const titleContainer = document.getElementById('title-container');
        const inputEl = document.getElementById('app-title-input');
        const saveBtn = document.getElementById('save-title-btn');
        const displayEl = document.getElementById('app-title-display');

        if(titleContainer) titleContainer.onclick = () => {
            if (inputEl.classList.contains('hidden')) {
                displayEl.classList.add('hidden'); inputEl.classList.remove('hidden'); saveBtn.classList.remove('hidden'); inputEl.focus();
            }
        };
        if(saveBtn) saveBtn.onclick = (e) => { e.stopPropagation(); finishTitleEdit(); };
        if(inputEl) {
            inputEl.onblur = finishTitleEdit;
            inputEl.onkeypress = (e) => { if(e.key === 'Enter') finishTitleEdit(); };
        }
        function finishTitleEdit() {
            state.appTitle = inputEl.value;
            displayEl.textContent = state.appTitle;
            displayEl.classList.remove('hidden'); inputEl.classList.add('hidden'); saveBtn.classList.add('hidden');
            scheduleSave();
        }

        // Helper
        function formatMoney(amount) {
            return state.isPrivacyMode ? '****' : `$${amount.toLocaleString()}`;
        }

        // Start
        init();

    </script>
</body>
</html>
