<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>可愛預算小管家 (PRO升級版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            text: '#f1f5f9',
                            subtext: '#94a3b8'
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase (使用 Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slide-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pop-in { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        .animate-pop-in { animation: pop-in 0.2s ease-out; }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }
        input:focus { outline: none; }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: flex-end; justify-content: center;
            background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        @media (min-width: 640px) { .modal-overlay { align-items: center; } }
        
        .modal-box {
            background-color: white; width: 100%; max-width: 28rem; 
            border-top-left-radius: 2rem; border-top-right-radius: 2rem;
            display: flex; flex-direction: column;
            max-height: 90vh; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .dark .modal-box { background-color: #1e293b; }
        @media (min-width: 640px) { .modal-box { border-radius: 2rem; } }

        .modal-header { padding: 1.25rem; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; min-height: 0; }
        .modal-footer { padding: 1rem 1.25rem; flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.05); }
        .calendar-day { min-height: 4rem; transition: background-color 0.2s; }
    </style>
</head>
<body class="bg-[#FFF0F5] text-slate-700 pb-24 transition-colors duration-300 dark:bg-dark-bg dark:text-dark-text selection:bg-pink-200 flex justify-center min-h-screen">

    <!-- 登入頁面 -->
    <div id="auth-overlay" class="fixed inset-0 z-[200] bg-[#FFF0F5] dark:bg-dark-bg flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white dark:bg-dark-card p-8 rounded-3xl shadow-xl border border-pink-100 dark:border-slate-700">
            <div class="text-center mb-8"><div class="text-6xl mb-4">🐰</div><h1 class="text-2xl font-black dark:text-white">記帳小管家</h1></div>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" class="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none dark:text-white border border-transparent">
                <input type="password" id="auth-password" placeholder="密碼" class="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none dark:text-white border border-transparent">
            </div>
            <div id="auth-error" class="text-red-500 text-xs mt-3 hidden text-center font-bold"></div>
            <button onclick="window.handleLogin()" class="w-full mt-6 py-3 bg-pink-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform">登入</button>
            <button onclick="window.handleSignup()" class="w-full mt-3 py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl">註冊新帳號</button>
            <div class="mt-6 text-center"><button onclick="window.startGuestMode()" class="text-xs text-slate-400 underline">離線試用</button></div>
        </div>
    </div>

    <!-- 主畫面 -->
    <div class="w-full max-w-lg min-h-screen relative bg-[#FFF0F5] dark:bg-dark-bg transition-colors duration-300 flex flex-col shadow-2xl">

        <!-- 導航 -->
        <div class="sticky top-0 z-30 bg-white/80 dark:bg-dark-card/80 backdrop-blur-md shadow-sm px-4 py-3 flex items-center justify-between flex-shrink-0 transition-colors duration-300">
            <div class="flex flex-col flex-1">
                <div class="flex items-center space-x-1 cursor-pointer" onclick="window.startEditTitle()">
                    <h1 id="app-title-display" class="text-base font-bold text-pink-800 dark:text-pink-300 truncate max-w-[150px]">載入中...</h1>
                    <input id="app-title-input" class="hidden w-32 bg-pink-50 dark:bg-slate-700 border border-pink-200 rounded px-1 text-sm font-bold text-pink-800 dark:text-pink-200 outline-none" />
                    <i data-lucide="edit-2" class="w-3 h-3 text-pink-300"></i>
                    <button id="save-title-btn" class="hidden p-1 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full ml-1" onclick="window.finishEditTitle()"><i data-lucide="check" class="w-3 h-3"></i></button>
                </div>
                <div class="flex items-center space-x-2 mt-1">
                    <button onclick="window.changeMonth(-1)" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <div class="relative group">
                        <span id="current-month-display" class="text-lg font-black text-slate-700 dark:text-white leading-none">2026年 1月</span>
                        <input type="month" id="month-picker" class="absolute inset-0 opacity-0 cursor-pointer" onchange="window.handleMonthChange(this)">
                    </div>
                    <button onclick="window.changeMonth(1)" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="window.toggleTheme()" class="p-2 bg-indigo-100 dark:bg-yellow-900/30 rounded-full text-indigo-600 dark:text-yellow-300 transition-colors"><i data-lucide="moon" class="w-5 h-5 dark:hidden"></i><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i></button>
                <button onclick="window.handleLogout()" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-500"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="px-4 pt-2 flex justify-end flex-shrink-0">
            <div id="cloud-status" class="flex items-center space-x-1 px-2 py-0.5 bg-white/50 dark:bg-slate-800/50 rounded-full text-[10px] transition-colors cursor-pointer border border-transparent" onclick="window.checkAuthStatus()">
                <i data-lucide="cloud" class="w-3 h-3 text-slate-400"></i><span class="text-slate-400">連線中</span>
            </div>
        </div>

        <!-- 內容區域 -->
        <div class="p-4 space-y-5 flex-1 overflow-y-auto hide-scrollbar">
            
            <!-- 進度卡片 -->
            <div class="bg-white dark:bg-dark-card p-5 rounded-3xl shadow-sm border border-pink-100 dark:border-slate-700 relative overflow-hidden transition-colors flex-shrink-0">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-pink-50 dark:bg-slate-700 rounded-full opacity-50 blur-2xl"></div>
                <div class="flex items-center justify-between mb-4 relative z-10">
                    <div class="flex items-center space-x-3">
                        <div id="hippo-avatar" class="text-5xl animate-bounce-slow">🦛</div>
                        <div>
                            <div id="hippo-msg" class="text-[10px] font-bold text-slate-400">計算中...</div>
                            <div class="flex items-baseline space-x-1">
                                <span class="text-xs text-slate-400 dark:text-slate-500">本月可用餘額</span>
                                <span id="total-remaining-display" class="text-3xl font-extrabold text-slate-700 dark:text-white">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right cursor-pointer" onclick="window.openManageIncomeModal()">
                        <div class="text-[10px] font-bold text-slate-400 uppercase">本月收入 <i data-lucide="settings-2" class="inline w-3 h-3"></i></div>
                        <div id="income-display" class="text-xl font-extrabold text-slate-700 dark:text-slate-200">$0</div>
                    </div>
                </div>
                <div class="relative z-10">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>存錢進度 (儲蓄率)</span><span id="savings-rate-percent">0%</span></div>
                    <div class="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                        <div id="main-progress-bar" class="h-full rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex p-1 bg-white dark:bg-dark-card rounded-xl border border-slate-100 dark:border-slate-700 overflow-x-auto hide-scrollbar flex-shrink-0">
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('assets')" id="tab-assets">帳戶</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('list')" id="tab-list">預算</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('ledger')" id="tab-ledger">明細</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('stats')" id="tab-stats">統計</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('calendar')" id="tab-calendar">日曆</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('wishlist')" id="tab-wishlist">存錢筒</button>
                <button class="view-tab flex-1 py-2 px-3 text-xs font-bold rounded-lg whitespace-nowrap" onclick="window.switchView('debts')" id="tab-debts">債務</button>
            </div>

            <!-- 視圖切換區 -->
            <div id="content-area" class="pb-10">
                <!-- 0. 資產 -->
                <div id="view-assets" class="hidden animate-slide-up space-y-4">
                    <div class="flex justify-between items-center px-1"><h2 class="text-sm font-bold text-slate-500">我的帳戶</h2><button onclick="window.openAccountModal()" class="text-xs font-bold text-pink-500 bg-white dark:bg-dark-card px-2 py-1 rounded-lg border border-pink-100 shadow-sm">+ 新增</button></div>
                    <div id="accounts-list" class="space-y-3"></div>
                    <button onclick="window.openTransferModal()" class="w-full py-3 bg-slate-800 dark:bg-slate-700 text-white rounded-xl shadow-lg text-sm font-bold">轉帳</button>
                </div>
                <!-- 1. 預算 -->
                <div id="view-list" class="hidden animate-slide-up space-y-4">
                    <div class="flex items-center justify-between px-1"><h2 class="text-sm font-bold text-slate-500">類別預算</h2><button onclick="window.openModal()" class="text-xs font-bold text-pink-500 bg-white dark:bg-dark-card px-2 py-1 rounded-lg shadow-sm border border-pink-100">+ 新增</button></div>
                    <div id="category-list" class="space-y-3"></div>
                </div>
                <!-- 2. 明細 -->
                <div id="view-ledger" class="hidden animate-slide-up space-y-3">
                    <div class="flex justify-between items-center px-1 mb-2">
                        <h2 class="text-sm font-bold text-slate-500">本月明細</h2>
                        <div class="text-[10px] text-slate-400">
                            收 <span id="ledger-income-total" class="text-green-500 font-bold ml-1 mr-2">0</span>
                            支 <span id="ledger-expense-total" class="text-red-500 font-bold ml-1">0</span>
                        </div>
                    </div>
                    <div class="flex justify-end mb-2">
                        <button onclick="window.openFixedExpenseModal()" class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg font-bold">固定支出管理</button>
                    </div>
                    <div id="ledger-list" class="space-y-2"></div>
                </div>
                <!-- 3. 統計 -->
                <div id="view-stats" class="hidden animate-slide-up space-y-6 pb-20">
                    <div class="bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">消費結構</h3>
                        <div class="h-64 w-full relative">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">收支概況</h3>
                        <div class="h-56 w-full relative">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
                <!-- 4. 日曆 -->
                <div id="view-calendar" class="hidden animate-slide-up bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-3">
                    <div class="grid grid-cols-7 text-center mb-2 text-xs font-bold text-slate-400">
                        <div class="text-red-400">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
                </div>
                <!-- 5. 目標 (現在連結到帳戶) -->
                <div id="view-wishlist" class="hidden animate-slide-up space-y-4">
                    <div class="flex justify-between items-center px-1"><h2 class="text-sm font-bold text-slate-500">我的存錢筒</h2><button onclick="window.openWishModal()" class="text-xs font-bold text-pink-500 bg-white dark:bg-dark-card px-2 py-1 rounded-lg border border-pink-100 shadow-sm">+ 新增</button></div>
                    <div id="wishlist-container" class="space-y-3"></div>
                </div>
                <!-- 6. 債務 -->
                <div id="view-debts" class="hidden animate-slide-up space-y-4">
                    <div class="grid grid-cols-2 gap-3 mb-2"><div class="bg-white dark:bg-dark-card p-3 rounded-xl border border-red-50 text-center"><div class="text-[10px] text-slate-400 uppercase">總欠款</div><div id="debt-owe-total" class="text-lg font-bold text-red-500">$0</div></div><div class="bg-white dark:bg-dark-card p-3 rounded-xl border border-green-50 text-center"><div class="text-[10px] text-slate-400 uppercase">總債權</div><div id="debt-lent-total" class="text-lg font-bold text-green-500">$0</div></div></div>
                    <div id="debt-list" class="space-y-3"></div>
                    <button onclick="window.openDebtModal()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm shadow-lg">+ 新增債務紀錄</button>
                </div>
            </div>
        </div>

        <!-- FAB -->
        <div class="fixed bottom-6 right-6 flex flex-col space-y-3 z-40">
            <button onclick="window.openIncomeModal()" class="w-12 h-12 bg-green-500 text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all"><i data-lucide="arrow-down"></i></button>
            <button onclick="window.openExpenseModal()" class="w-14 h-14 bg-pink-500 text-white rounded-full shadow-xl flex items-center justify-center active:scale-90 transition-all shadow-pink-200"><i data-lucide="plus" class="w-8 h-8"></i></button>
        </div>

        <!-- Modals -->
        
        <!-- 固定支出 -->
        <div id="modal-fixed" class="modal-overlay hidden">
            <div class="modal-box animate-slide-up">
                <div class="modal-header"><h2 class="text-xl font-bold dark:text-white">固定支出設定</h2></div>
                <div class="modal-body">
                    <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border dark:border-slate-700 mb-4">
                        <div class="text-xs font-bold text-slate-400 mb-2">新增項目</div>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="fix-new-name" placeholder="項目名稱 (ex: Netflix)" class="flex-[2] bg-white dark:bg-slate-700 p-2 rounded-lg text-sm dark:text-white outline-none">
                            <input type="number" id="fix-new-amount" placeholder="$" class="flex-1 bg-white dark:bg-slate-700 p-2 rounded-lg text-sm dark:text-white outline-none">
                        </div>
                        <div class="flex gap-2 items-center">
                            <select id="fix-new-cat" class="flex-1 bg-white dark:bg-slate-700 p-2 rounded-lg text-sm dark:text-white outline-none"></select>
                            <button onclick="window.addFixedExpense()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow font-bold text-xs flex-shrink-0">加入</button>
                        </div>
                    </div>
                    <div id="fixed-items-list" class="space-y-2"></div>
                </div>
                <div class="modal-footer flex flex-col gap-2">
                    <button onclick="window.importFixedExpenses()" class="w-full py-4 bg-pink-500 text-white font-black rounded-2xl shadow-lg shadow-pink-100">匯入本月帳單</button>
                    <button onclick="window.closeModal('modal-fixed')" class="w-full py-3 text-slate-500">關閉</button>
                </div>
            </div>
        </div>

        <!-- 管理本月收入 Modal -->
        <div id="modal-manage-income" class="modal-overlay hidden">
            <div class="modal-box animate-pop-in">
                <div class="modal-header font-bold text-xl dark:text-white">本月收入明細</div>
                <div id="manage-income-list" class="modal-body space-y-2"></div>
                <div class="modal-footer">
                    <button onclick="window.closeModal('modal-manage-income')" class="w-full py-3 bg-slate-100 rounded-xl font-bold">關閉</button>
                </div>
            </div>
        </div>

        <!-- 債務 Modal -->
        <div id="modal-debt" class="modal-overlay hidden">
            <div class="modal-box animate-pop-in">
                <div class="modal-header font-bold text-xl dark:text-white">債務記錄</div>
                <div class="modal-body space-y-4">
                    <div class="flex gap-2 p-1 bg-slate-50 dark:bg-slate-800 rounded-2xl border dark:border-slate-700">
                        <button id="debt-type-lent" class="debt-type-btn flex-1 py-2 rounded-xl text-xs font-bold" onclick="window.setDebtType('lent')">別人欠我</button>
                        <button id="debt-type-borrowed" class="debt-type-btn flex-1 py-2 rounded-xl text-xs font-bold" onclick="window.setDebtType('borrowed')">我欠別人</button>
                    </div>
                    <input type="text" id="debt-input-name" placeholder="對象姓名" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white outline-none">
                    <input type="number" id="debt-input-amount" placeholder="金額" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white font-black text-2xl">
                    <input type="text" id="debt-input-note" placeholder="備註" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white text-sm">
                </div>
                <div class="modal-footer flex gap-3">
                    <button id="btn-debt-delete" class="p-4 bg-red-50 text-red-500 rounded-2xl hidden" onclick="window.handleDeleteDebt()"><i data-lucide="trash-2"></i></button>
                    <button onclick="window.closeModal('modal-debt')" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">取消</button>
                    <button class="flex-[2] py-4 bg-slate-800 text-white font-bold rounded-2xl shadow-lg" onclick="window.handleSaveDebt()">儲存</button>
                </div>
            </div>
        </div>

        <!-- 存錢目標 (建立存錢帳戶) Modal -->
        <div id="modal-wish" class="modal-overlay hidden">
            <div class="modal-box animate-pop-in">
                <div class="modal-header font-bold text-xl dark:text-white">新增存錢筒</div>
                <div class="modal-body space-y-4">
                    <div class="bg-indigo-50 p-4 rounded-xl text-xs text-indigo-700 mb-2">
                        💡 系統會為此目標建立一個專屬的「存錢帳戶」，您可以從其他帳戶轉帳進來，進度條就會自動增加喔！
                    </div>
                    <input type="text" id="wish-input-name" placeholder="目標名稱 (ex: 旅行基金)" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white outline-none">
                    <input type="number" id="wish-input-goal" placeholder="目標金額" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white font-bold text-xl">
                    <input type="number" id="wish-input-current" placeholder="初始金額 (選填)" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl dark:text-white font-bold text-xl">
                </div>
                <div class="modal-footer flex gap-3">
                    <button id="btn-wish-delete" class="p-4 bg-red-50 text-red-500 rounded-2xl hidden" onclick="window.handleDeleteWish()"><i data-lucide="trash-2"></i></button>
                    <button onclick="window.closeModal('modal-wish')" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">取消</button>
                    <button class="flex-[2] py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg" onclick="window.handleSaveWish()">建立帳戶</button>
                </div>
            </div>
        </div>

        <!-- 日曆細節 -->
        <div id="modal-day-detail" class="modal-overlay hidden">
            <div class="modal-box animate-slide-up">
                <div class="modal-header flex justify-between items-center"><h2 id="day-detail-title" class="text-xl font-bold dark:text-white"></h2></div>
                <div id="day-detail-items" class="modal-body space-y-3"></div>

        <!-- 收入/支出/帳戶/轉帳 (modal-box 結構) -->
        <div id="modal-income" class="modal-overlay hidden"><div class="modal-box"><div class="modal-header font-bold text-xl">記一筆收入</div><div class="modal-body space-y-4"><div><label class="text-[10px] font-black uppercase text-slate-400">存入</label><select id="inc-input-acc" class="w-full mt-1 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"></select></div><input type="text" id="inc-input-name" placeholder="項目" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"><input type="number" id="inc-input-amount" placeholder="金額" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl font-black text-2xl outline-none"><input type="date" id="inc-input-date" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"></div><div class="modal-footer flex gap-3"><button onclick="window.closeModal('modal-income')" class="flex-1 py-4 bg-slate-100">取消</button><button onclick="window.handleSaveIncome()" class="flex-[2] py-4 bg-green-500 text-white font-bold rounded-2xl">儲存</button></div></div></div>
        
        <div id="modal-expense" class="modal-overlay hidden"><div class="modal-box"><div class="modal-header font-bold text-xl">記一筆支出</div><div class="modal-body space-y-4"><div><label class="text-[10px] font-black uppercase text-slate-400">扣款</label><select id="exp-input-acc" class="w-full mt-1 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"></select></div><input type="date" id="exp-input-date" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"><input type="number" id="exp-input-amount" placeholder="金額" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl font-black text-2xl outline-none"><div><label class="text-[10px] font-black uppercase text-slate-400 text-center">類別</label><div id="exp-cat-picker" class="grid grid-cols-3 gap-2 mt-2"></div></div><input type="text" id="exp-input-note" placeholder="備註" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"></div><div class="modal-footer flex gap-3"><button onclick="window.closeModal('modal-expense')" class="flex-1 py-4 bg-slate-100">取消</button><button onclick="window.handleSaveExpense()" class="flex-[2] py-4 bg-slate-800 text-white font-bold rounded-2xl">儲存</button></div></div></div>
        
        <!-- 帳戶 Modal -->
        <div id="modal-account" class="modal-overlay hidden"><div class="modal-box"><div class="modal-header font-bold text-xl">帳戶設定</div><div class="modal-body space-y-4"><input type="text" id="acc-input-name" placeholder="帳戶名稱" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"><div class="flex gap-2"><button id="acc-type-general" class="acc-type-btn flex-1 py-3 border rounded-xl" onclick="window.setAccType('general')">一般</button><button id="acc-type-savings" class="acc-type-btn flex-1 py-3 border rounded-xl" onclick="window.setAccType('savings')">儲蓄</button></div>
        <div class="flex items-center gap-2 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
            <input type="checkbox" id="acc-is-hidden" class="w-5 h-5 accent-pink-500">
            <label for="acc-is-hidden" class="text-sm dark:text-white">不計入總資產 (如：私房錢)</label>
        </div>
        <input type="number" id="acc-input-init" placeholder="校正金額 / 初始金額" class="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none"></div><div class="modal-footer flex gap-3"><button id="btn-acc-delete" class="p-4 bg-red-50 text-red-500 rounded-2xl hidden" onclick="window.handleDeleteAccount()"><i data-lucide="trash-2"></i></button><button onclick="window.closeModal('modal-account')" class="flex-1 py-4 bg-slate-100">取消</button><button onclick="window.handleSaveAccount()" class="flex-[2] py-4 bg-slate-800 text-white font-bold rounded-2xl">儲存</button></div></div></div>
        
        <div id="transfer-modal" class="modal-overlay hidden"><div class="modal-box"><div class="modal-header font-bold text-xl">帳戶轉帳</div><div class="modal-body space-y-4"><div class="flex gap-2"><div class="flex-1"><div class="text-[10px] mb-1">從</div><select id="trans-from" class="w-full p-2 bg-slate-50 rounded-xl"></select></div><div class="flex items-center pt-4"><i data-lucide="arrow-right"></i></div><div class="flex-1"><div class="text-[10px] mb-1">到</div><select id="trans-to" class="w-full p-2 bg-slate-50 rounded-xl"></select></div></div><input id="trans-amount" type="number" placeholder="金額" class="text-2xl font-black w-full p-2"><input id="trans-note" type="text" placeholder="備註" class="w-full p-2"></div><div class="modal-footer flex gap-3"><button onclick="window.closeModal('transfer-modal')" class="flex-1 py-4 bg-slate-100">取消</button><button onclick="window.handleSaveTransfer()" class="flex-[2] py-4 bg-indigo-600 text-white font-bold rounded-2xl">轉帳</button></div></div></div>
        
        <!-- 類別詳情 -->
        <div id="category-detail-modal" class="modal-overlay hidden"><div class="modal-box"><div class="modal-header flex justify-between items-center"><h2 id="detail-title" class="text-xl font-bold dark:text-white"></h2><button id="detail-edit-btn" class="text-xs bg-slate-100 px-3 py-1 rounded-full">修改</button></div><div class="px-6 mb-2"><div id="detail-subtitle" class="text-xs text-slate-400"></div></div><div id="detail-list" class="modal-body hide-scrollbar"></div><div class="modal-footer"><button onclick="window.closeModal('category-detail-modal')" class="w-full py-3 bg-slate-100 rounded-xl">關閉</button></div></div></div>

    </div>

    <!-- 邏輯腳本 -->
    <script>
        const firebaseConfig = { apiKey: "AIzaSyD6HngA3NX5sMW6jSvDE0b90ozr_cw0yCk", authDomain: "budget-70835.firebaseapp.com", projectId: "budget-70835", storageBucket: "budget-70835.firebasestorage.app", messagingSenderId: "780821810140", appId: "1:780821810140:web:e8cc10ae8bb8bd7b10dd19", measurementId: "G-PVVY6Z5JV4" };
        const APP_ID = 'budget-app-deploy'; 
        const COLORS = ['#FCA5A5', '#FDBA74', '#FDE047', '#86EFAC', '#93C5FD', '#C4B5FD', '#F9A8D4', '#CBD5E1'];
        const ICONS = ['wallet', 'home', 'coffee', 'smartphone', 'shopping-bag', 'heart', 'plane', 'gift', 'music', 'sparkles', 'clapperboard', 'bus'];
        
        let app, auth, db;
        try {
            firebase.initializeApp(firebaseConfig);
            app = firebase.app();
            auth = firebase.auth();
            db = firebase.firestore();
        } catch(e) { console.error("Firebase Init Error (Running Offline)", e); }

        let state = {
            user: null, isOffline: false, currentDate: new Date(), viewMode: 'list', isDarkMode: localStorage.getItem('darkMode')==='true',
            accounts: [], categories: [], fixedExpenses: [], incomes: [], expenses: [], transfers: [], debts: [], 
            appTitle: "2026 小富婆計畫", isPrivacyMode: false, editingId: null, editingAccId: null
        };
        let charts = {};
        
        // --- 核心變數與函數 ---
        let currentEditingWishId = null;
        let currentEditingDebtId = null;
        let currentDebtType = 'lent';
        let currentAccType = 'general';
        let currentSelectedColor = COLORS[0];
        let currentSelectedIcon = ICONS[0];
        let currentSelectedExpCat = null;

        function uuid() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function formatMoney(n) { return state.isPrivacyMode ? '****' : `$${Number(n).toLocaleString()}`; }
        function calculateMonthlyTotalIncome() {
            const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
            return state.incomes.filter(i => { const d = new Date(i.date); return d.getFullYear() === y && d.getMonth() === m; }).reduce((s, i) => s + Number(i.amount), 0);
        }

        // 掛載到 Window
        window.uuid = uuid;
        window.formatMoney = formatMoney;
        window.calculateMonthlyTotalIncome = calculateMonthlyTotalIncome;
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openModalById = (id) => document.getElementById(id).classList.remove('hidden');

        async function init() {
            applyTheme(); loadFromLocal();
            // Default Account Logic
            if(state.accounts.length === 0) {
                state.accounts.push({id: 'main', name: '日常錢包', type: 'general', isHidden: false});
            }
            renderAll();
            
            if(auth) {
                auth.onAuthStateChanged((user) => {
                    if(user) { state.user = user; state.isOffline = false; document.getElementById('auth-overlay').classList.add('hidden'); setupDataListener(user.uid); }
                    else { document.getElementById('auth-overlay').classList.remove('hidden'); }
                });
            } else {
                window.startGuestMode();
            }
        }

        // Auth
        window.handleLogin = () => { if(auth) auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-password').value).catch(e => alert(e.message)); };
        window.handleSignup = () => { if(auth) auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-password').value).catch(e => alert(e.message)); };
        window.handleLogout = () => { if(auth) auth.signOut(); };
        window.startGuestMode = () => { state.isOffline=true; document.getElementById('auth-overlay').classList.add('hidden'); renderAll(); };
        window.checkAuthStatus = () => { if(state.isOffline) document.getElementById('auth-overlay').classList.remove('hidden'); };

        // Data
        function setupDataListener(uid) {
            if(!db) return;
            db.collection('artifacts').doc(APP_ID).collection('users').doc(uid).collection('data').doc('budget_v2').onSnapshot((docSnap) => {
                if(docSnap.exists) { Object.assign(state, docSnap.data()); renderAll(); }
            });
        }
        function loadFromLocal() { const d = JSON.parse(localStorage.getItem('budget_v2_local')); if(d) Object.assign(state, d); }
        let saveTimer;
        function scheduleSave() {
            updateSaveStatus('saving'); clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                localStorage.setItem('budget_v2_local', JSON.stringify(state));
                if(state.user && !state.isOffline && db) {
                    try { await db.collection('artifacts').doc(APP_ID).collection('users').doc(state.user.uid).collection('data').doc('budget_v2').set(state, {merge:true}); updateSaveStatus('saved'); } catch(e) { updateSaveStatus('error'); }
                } else { updateSaveStatus('saved-local'); }
            }, 1000);
        }

        function calculateTotalBalance() {
            return state.accounts
                .filter(acc => !acc.isHidden) // Only sum accounts that are NOT hidden
                .reduce((total, acc) => total + getAccountBalance(acc.id), 0);
        }

        function renderAll() {
            const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth()+1;
            document.getElementById('app-title-display').textContent = state.appTitle;
            document.getElementById('current-month-display').textContent = `${y}年 ${m}月`;
            document.getElementById('income-display').textContent = formatMoney(calculateMonthlyTotalIncome());
            
            // Logic change: Use calculateTotalBalance for "Total Remaining" 
            // NOTE: Original "Remaining" logic was Income - Expense. 
            // The user requested "When income/balance is zero, account total should be zero". 
            // This implies the main display should reflect ACTUAL money, not just monthly budget remaining.
            // However, "本月結餘" usually means Monthly Income - Monthly Expense.
            // Let's change the label to "本月可用餘額" (Monthly Available) or just show Total Assets if preferred.
            // Given the request, I'll stick to Monthly logic for the card but Ensure account logic is solid.
            // User said: "When income and balance zero, account total should zero". This means if I delete data, it zeros out.
            
            const inc = calculateMonthlyTotalIncome();
            const exp = state.expenses.filter(e => new Date(e.date).getMonth() === state.currentDate.getMonth()).reduce((s, e) => s + Number(e.amount), 0);
            
            // Update: Total Remaining Display now shows sum of ACTIVE accounts (liquid assets)
            // Or keep it as Monthly Budget? User said "Account total should zero".
            // Let's make the main display show "Total Liquid Assets" instead of just monthly savings?
            // Actually, usually these apps show "Monthly Remaining". Let's update the label to be safe.
            // But for now, let's keep the logic:
            
            // Recalculate everything based on current data
            const totalLiquidAssets = calculateTotalBalance();
            document.getElementById('total-remaining-display').textContent = formatMoney(totalLiquidAssets); 
            // Changed from (inc-exp) to totalLiquidAssets to satisfy "Account total" request.
            // Also changed label in HTML to "本月可用餘額" -> "總資產" or just keep it and let user know.
            // Reverting label to "本月可用餘額" is safer, but displaying Total Balance is what was requested implicitly.

            const rate = inc > 0 ? Math.max(0, ((inc - exp)/inc)*100) : 0;
            document.getElementById('savings-rate-percent').textContent = Math.round(rate) + '%';
            document.getElementById('main-progress-bar').style.width = Math.min(100, rate) + '%';
            document.getElementById('main-progress-bar').className = `h-full rounded-full transition-all duration-700 ${rate > 50 ? 'bg-green-500' : (rate > 20 ? 'bg-yellow-500' : 'bg-red-500')}`;
            
            document.querySelectorAll('.view-tab').forEach(b => {
                const isActive = b.dataset.view === state.viewMode;
                b.className = `view-tab flex-1 py-2 px-3 text-[10px] font-bold rounded-lg transition-all whitespace-nowrap ${isActive ? 'bg-pink-50 text-pink-600 dark:bg-slate-700 dark:text-white shadow-sm' : 'text-slate-400 dark:text-slate-500'}`;
            });
            ['assets','list','ledger','stats','calendar','wishlist','debts'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${state.viewMode}`).classList.remove('hidden');
            
            if(state.viewMode === 'assets') renderAssets();
            if(state.viewMode === 'list') { renderBudget(); }
            if(state.viewMode === 'ledger') renderLedger();
            if(state.viewMode === 'stats') renderStats();
            if(state.viewMode === 'calendar') renderCalendar();
            if(state.viewMode === 'wishlist') renderWishlist();
            if(state.viewMode === 'debts') renderDebts();
            
            lucide.createIcons();
        }

        window.switchView = (v) => { state.viewMode = v; renderAll(); };
        window.changeMonth = (dir) => { state.currentDate.setMonth(state.currentDate.getMonth() + dir); renderAll(); };
        window.handleMonthChange = (e) => { const [y, m] = e.value.split('-'); state.currentDate = new Date(y, m-1, 1); renderAll(); };

        // --- Logic & Renderers ---
        function getAccountBalance(accId) {
            const inc = state.incomes.filter(i => i.accountId === accId).reduce((s,i)=>s+Number(i.amount),0);
            const exp = state.expenses.filter(e => e.accountId === accId).reduce((s,e)=>s+Number(e.amount),0);
            const transIn = state.transfers.filter(t => t.toId === accId).reduce((s,t)=>s+Number(t.amount),0);
            const transOut = state.transfers.filter(t => t.fromId === accId).reduce((s,t)=>s+Number(t.amount),0);
            return inc - exp + transIn - transOut;
        }

        function renderAssets() {
            const list = document.getElementById('accounts-list'); list.innerHTML = '';
            state.accounts.forEach(acc => {
                const bal = getAccountBalance(acc.id);
                const div = document.createElement('div');
                div.className = `bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border dark:border-slate-700 flex justify-between items-center transition-all cursor-pointer ${acc.isHidden ? 'opacity-50' : ''}`;
                // Add click to edit
                div.onclick = (e) => { 
                    // Prevent editing if clicking a button inside (future proofing)
                    window.openEditAccount(acc.id); 
                };
                
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="p-2 rounded-full bg-pink-50 dark:bg-slate-800 text-pink-500">
                            <i data-lucide="${acc.type==='savings'?'piggy-bank':'wallet'}"></i>
                        </div>
                        <div>
                            <div class="font-bold dark:text-white">${acc.name}</div>
                            ${acc.isHidden ? '<div class="text-[10px] text-slate-400">不計入總資產</div>' : ''}
                        </div>
                    </div>
                    <div class="text-xl font-black dark:text-white">${formatMoney(bal)}</div>
                `;
                list.appendChild(div);
            });
        }
        
        // ** Account Editing **
        window.openAccountModal = () => { 
            state.editingAccId = null; 
            window.setAccType('general'); 
            document.getElementById('acc-input-name').value = ''; 
            document.getElementById('acc-input-init').value = '';
            document.getElementById('acc-is-hidden').checked = false;
            document.getElementById('btn-acc-delete').classList.add('hidden');
            window.openModalById('modal-account'); 
        };
        window.openEditAccount = (id) => {
            const acc = state.accounts.find(a => a.id === id);
            if(!acc) return;
            state.editingAccId = id;
            document.getElementById('acc-input-name').value = acc.name;
            document.getElementById('acc-input-init').value = ''; // Don't show init balance as it's a transaction
            document.getElementById('acc-is-hidden').checked = acc.isHidden || false;
            window.setAccType(acc.type);
            document.getElementById('btn-acc-delete').classList.remove('hidden');
            window.openModalById('modal-account');
        };
        window.handleSaveAccount = () => {
            const n = document.getElementById('acc-input-name').value;
            const i = document.getElementById('acc-input-init').value;
            const isHidden = document.getElementById('acc-is-hidden').checked;
            
            if(!n) return;
            
            if(state.editingAccId) {
                // Update
                state.accounts = state.accounts.map(a => a.id === state.editingAccId ? {...a, name: n, type: currentAccType, isHidden} : a);
                // If user entered an adjustment amount
                if(i && !isNaN(i)) {
                    // Treat as correction
                    state.incomes.push({id:uuid(), name:'帳戶校正', amount:Number(i), accountId:state.editingAccId, date:new Date().toISOString()});
                }
            } else {
                // Create
                const id = uuid(); 
                state.accounts.push({id, name:n, type:currentAccType, isHidden});
                if(i > 0) state.incomes.push({id:uuid(), name:'初始餘額', amount:Number(i), accountId:id, date:new Date().toISOString()});
            }
            window.closeModal('modal-account'); renderAll(); scheduleSave();
        };
        window.handleDeleteAccount = () => {
            if(confirm('確定刪除此帳戶？這不會刪除已發生的收支紀錄，但會影響餘額統計。')) {
                state.accounts = state.accounts.filter(a => a.id !== state.editingAccId);
                window.closeModal('modal-account'); renderAll(); scheduleSave();
            }
        };

        // ** Manage Income **
        window.openManageIncomeModal = () => {
            const list = document.getElementById('manage-income-list');
            list.innerHTML = '';
            const m = state.currentDate.getMonth(), y = state.currentDate.getFullYear();
            const incomes = state.incomes.filter(i => { const d = new Date(i.date); return d.getMonth() === m && d.getFullYear() === y; });
            
            if(incomes.length === 0) list.innerHTML = '<div class="text-center text-slate-400 py-4">本月尚無收入</div>';
            
            incomes.forEach(inc => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl";
                div.innerHTML = `
                    <div>
                        <div class="font-bold dark:text-white">${inc.name}</div>
                        <div class="text-xs text-slate-400">${new Date(inc.date).toLocaleDateString()}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-green-500">+${formatMoney(inc.amount)}</span>
                        <button onclick="window.deleteIncome('${inc.id}')" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();
            window.openModalById('modal-manage-income');
        };
        window.deleteIncome = (id) => {
            if(confirm('刪除此筆收入？')) {
                state.incomes = state.incomes.filter(i => i.id !== id);
                window.openManageIncomeModal(); // Refresh list
                renderAll(); scheduleSave();
            }
        };

        // ** Fixed Expenses with Categories **
        window.openFixedExpenseModal = () => { 
            // Populate Category Select
            const sel = document.getElementById('fix-new-cat');
            sel.innerHTML = '';
            if(state.categories.length === 0) {
                 sel.innerHTML = '<option disabled selected>請先建立預算類別</option>';
            } else {
                state.categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.innerText = c.name;
                    sel.appendChild(opt);
                });
            }
            window.openModalById('modal-fixed'); 
            renderFixedList(); 
        };
        
        window.addFixedExpense = () => {
            const n = document.getElementById('fix-new-name').value;
            const a = document.getElementById('fix-new-amount').value;
            const c = document.getElementById('fix-new-cat').value;
            
            if(!c) return alert('請選擇一個類別！');
            if(n && a) { 
                state.fixedExpenses.push({id:uuid(), name:n, amount:Number(a), catId: c}); 
                document.getElementById('fix-new-name').value=''; 
                document.getElementById('fix-new-amount').value=''; 
                renderFixedList(); 
                scheduleSave(); 
            }
        };
        
        function renderFixedList() {
            const list = document.getElementById('fixed-items-list'); list.innerHTML = '';
            state.fixedExpenses.forEach(f => {
                const cat = state.categories.find(c => c.id === f.catId);
                const div = document.createElement('div');
                div.className = "flex justify-between p-3 bg-slate-50 dark:bg-slate-800 rounded-lg mb-1 items-center";
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-sm dark:text-white font-bold">${f.name} ($${f.amount})</span>
                        <span class="text-[10px] text-slate-400" style="color:${cat?.color || '#94a3b8'}">${cat?.name || '未知類別'}</span>
                    </div>
                    <button class="text-red-400 p-2" onclick="window.deleteFixed(event, '${f.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                `;
                list.appendChild(div);
            });

                            note: f.name + ' (固定)',

                            date: date

                scheduleSave();

        // --- Standard Logic ---
        
        function renderBudget() {
            const list = document.getElementById('category-list'); list.innerHTML = '';
            state.categories.forEach(cat => {
                const { remaining, percentage } = getCategoryStats(cat.id, state.currentDate);
                const div = document.createElement('div');
                div.className = "bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border dark:border-slate-700 cursor-pointer";
                div.innerHTML = `<div class="flex justify-between mb-2 font-bold"><span class="dark:text-white">${cat.name}</span><span class="${remaining<0?'text-red-500':'text-slate-700 dark:text-slate-200'}">剩 ${formatMoney(remaining)}</span></div><div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full"><div class="h-full rounded-full ${remaining<0?'bg-red-400':''}" style="width:${Math.min(100, percentage)}%; background-color:${remaining<0?'':cat.color}"></div></div>`;
                div.onclick = () => window.openEditCategory(cat.id);
                list.appendChild(div);
            });
        }
        
        function renderLedger() {
            const list = document.getElementById('ledger-list'); list.innerHTML = '';
            const m = state.currentDate.getMonth(), y = state.currentDate.getFullYear();
            const incs = state.incomes.filter(i => { const d = new Date(i.date); return d.getMonth() === m && d.getFullYear() === y; });
            const exps = state.expenses.filter(e => { const d = new Date(e.date); return d.getMonth() === m && d.getFullYear() === y; });
            document.getElementById('ledger-income-total').textContent = formatMoney(incs.reduce((s,i)=>s+Number(i.amount),0));
            document.getElementById('ledger-expense-total').textContent = formatMoney(exps.reduce((s,e)=>s+Number(e.amount),0));
            const all = [...incs.map(i=>({...i, type:'inc'})), ...exps.map(e=>({...e, type:'exp'}))].sort((a,b) => new Date(b.date) - new Date(a.date));
            all.forEach(item => {
                const div = document.createElement('div');
                const isInc = item.type === 'inc';
                div.className = "flex justify-between items-center p-3 bg-white dark:bg-dark-card rounded-xl border dark:border-slate-800";
                div.innerHTML = `<div><div class="font-bold dark:text-white text-sm">${item.name || item.note || (item.type==='inc'?'收入':'支出')}</div><div class="text-[10px] text-slate-400">${new Date(item.date).getDate()}日</div></div><div class="font-bold ${item.type==='inc'?'text-green-500':'text-slate-700 dark:text-slate-200'}">${item.type==='inc'?'+':'-'}${formatMoney(item.amount)}</div>`;
                div.onclick = (e) => { 
                    if(confirm('要刪除這筆紀錄嗎？')) { 
                        if(isInc) state.incomes = state.incomes.filter(x=>x.id!==item.id); 
                        else state.expenses = state.expenses.filter(x=>x.id!==item.id); 
                        renderAll(); scheduleSave(); 
                    }
                };
                list.appendChild(div);
            });
        }
        
        function getCategoryStats(catId, targetDate) {
            const y = targetDate.getFullYear(), m = targetDate.getMonth();
            const monthExpenses = state.expenses.filter(e => { const d = new Date(e.date); return d.getFullYear() === y && d.getMonth() === m && e.catId === catId; });
            const spent = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
            const category = state.categories.find(c => c.id === catId);
            const budget = Number(category?.amount || 0);
            return { spent, budget, remaining: budget - spent, percentage: budget > 0 ? (spent / budget) * 100 : 0 };
        }

        function renderStats() {
            // Apply text color based on theme
            const textColor = state.isDarkMode ? '#e2e8f0' : '#475569';
            Chart.defaults.color = textColor;
            Chart.defaults.scale.grid.color = state.isDarkMode ? '#334155' : '#e2e8f0';

            const m = state.currentDate.getMonth();
            const income = calculateMonthlyTotalIncome();
            const expense = state.expenses.filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === m;
            }).reduce((s, e) => s + Number(e.amount), 0);

            // Pie Chart
            const ctxPie = document.getElementById('pieChart');
            if (charts.pie) charts.pie.destroy();

            if (expense === 0) {
                ctxPie.style.display = 'none';
                let noDataMsg = document.getElementById('pie-no-data');
                if (!noDataMsg) {
                    noDataMsg = document.createElement('div');
                    noDataMsg.id = 'pie-no-data';
                    noDataMsg.className = 'absolute inset-0 flex items-center justify-center text-slate-400 text-xs';
                    noDataMsg.innerText = '本月尚無支出資料';
                    ctxPie.parentNode.appendChild(noDataMsg);
                } else {
                    noDataMsg.style.display = 'flex';
                }
            } else {
                ctxPie.style.display = 'block';
                const noDataMsg = document.getElementById('pie-no-data');
                if (noDataMsg) noDataMsg.style.display = 'none';

                const catData = state.categories.map(c => state.expenses.filter(e => e.catId === c.id && new Date(e.date).getMonth() === m).reduce((s, x) => s + Number(x.amount), 0));
                
                charts.pie = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: state.categories.map(c => c.name),
                        datasets: [{
                            data: catData,
                            backgroundColor: state.categories.map(c => c.color),
                            borderWidth: 0
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                        }
                    }
                });
            }
            
            // Bar Chart
            const ctxBar = document.getElementById('barChart');
            if (charts.bar) charts.bar.destroy();
            
            if (income === 0 && expense === 0) {
                ctxBar.style.display = 'none';
                 let noDataMsg = document.getElementById('bar-no-data');
                if (!noDataMsg) {
                    noDataMsg = document.createElement('div');
                    noDataMsg.id = 'bar-no-data';
                    noDataMsg.className = 'absolute inset-0 flex items-center justify-center text-slate-400 text-xs';
                    noDataMsg.innerText = '本月尚無收支資料';
                    ctxBar.parentNode.appendChild(noDataMsg);
                } else {
                    noDataMsg.style.display = 'flex';
                }
            } else {
                ctxBar.style.display = 'block';
                const noDataMsg = document.getElementById('bar-no-data');
                if (noDataMsg) noDataMsg.style.display = 'none';

                charts.bar = new Chart(ctxBar, { 
                    type: 'bar', 
                    data: { 
                        labels: ['收', '支'], 
                        datasets: [{ 
                            data: [income, expense], 
                            backgroundColor: ['#4ade80', '#f87171'],
                            barThickness: 30,
                            borderRadius: 4
                        }] 
                    }, 
                    options: { 
                        maintainAspectRatio: false, 
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, grid: { display: false } },
                            x: { grid: { display: false } }
                        },
                        plugins: { legend: { display: false } }
                    } 
                });
            }
        }

        function renderDebts() {
            const list = document.getElementById('debt-list'); list.innerHTML = '';
            const tLent = state.debts.filter(d=>d.type==='lent').reduce((s,d)=>s+Number(d.amount),0);

            const grid = document.getElementById('exp-cat-picker'); grid.innerHTML = '';
            if(state.categories.length > 0) currentSelectedExpCat = state.categories[0].id;
            state.categories.forEach(c => {
                const btn = document.createElement('div');
                btn.className = `p-2 border rounded-lg cursor-pointer flex flex-col items-center ${currentSelectedExpCat===c.id?'ring-2 ring-pink-400':'dark:border-slate-700'}`;
                btn.innerHTML = `<i data-lucide="${c.icon}" class="w-4 h-4" style="color:${c.color}"></i><span class="text-[8px] dark:text-white mt-1">${c.name}</span>`;
                btn.onclick = () => { document.querySelectorAll('#exp-cat-picker > div').forEach(d=>d.classList.remove('ring-2','ring-pink-300')); btn.classList.add('ring-2','ring-pink-300'); currentSelectedExpCat = c.id; };
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }
        
        function updateSaveStatus(s) { const el = document.getElementById('cloud-status'); if(!el) return; let tx='已同步', cl='text-green-500'; if(s==='saving'){tx='儲存中';cl='text-blue-400';} else if(s==='error'){tx='錯誤';cl='text-red-500';} el.innerHTML=`<i data-lucide="cloud" class="w-3 h-3 ${cl}"></i><span class="${cl}">${tx}</span>`; lucide.createIcons(); }
        function applyTheme() { if(state.isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }
        window.toggleTheme = () => { state.isDarkMode = !state.isDarkMode; localStorage.setItem('darkMode', state.isDarkMode); applyTheme(); renderAll(); };
        window.startEditTitle = () => { document.getElementById('app-title-display').classList.add('hidden'); document.getElementById('app-title-input').classList.remove('hidden'); document.getElementById('save-title-btn').classList.remove('hidden'); document.getElementById('app-title-input').focus(); };
        window.finishEditTitle = () => { state.appTitle = document.getElementById('app-title-input').value; document.getElementById('app-title-display').classList.remove('hidden'); document.getElementById('app-title-input').classList.add('hidden'); document.getElementById('save-title-btn').classList.add('hidden'); scheduleSave(); renderAll(); };
        
        init();
    </script>
</body>
</html>
